name: IPAForge
options:
  bundleIdPrefix: com.ou71and3r
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.21
  rork-sign:
    url: https://github.com/rorkai/rork-sign.git
    from: 0.6.5
targets:
  IPAForge:
    type: application
    platform: iOS
    sources:
      - path: Sources/IPAForge
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: rork-sign
        product: RorkSign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ou71and3r.ipaforge
        PRODUCT_NAME: IPAForge
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/IPAForge/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  IPAForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/IPAForgeTests
    dependencies:
      - target: IPAForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ou71and3r.ipaforge.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IPAForge
schemes:
  IPAForge:
    build:
      targets:
        IPAForge: all
    test:
      targets:
        - IPAForgeTests
